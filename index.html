<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Drini Bird">
<meta name="theme-color" content="#0b1026">
<title>Drini Bird</title>
<style>
html,body{margin:0;height:100%;background:#0b1026;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
canvas{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;display:block}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
(() => {
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const LH = 640;               // logische Höhe
let LW = 400, scale = 1, dpr = 1;
function resize(){
  dpr = Math.min(3, window.devicePixelRatio || 1);
  const w = window.innerWidth, h = window.innerHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  scale = h / LH; LW = Math.max(320, Math.min(1100, w / scale));
}
addEventListener('resize', resize); addEventListener('orientationchange', () => setTimeout(resize, 200)); resize();

/* ---------- Sound ---------- */
let ac = null;
function audio(){ if (!ac) { try { ac = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {} } if (ac && ac.state === 'suspended') ac.resume().catch(()=>{}); }
function tone(f, d, type='square', vol=0.06, slide=0){
  if (!ac) return;
  try { const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = type; o.frequency.setValueAtTime(f, t); if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t+d);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t+d); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d); } catch(e) {}
}
const sfx = {
  flap: () => { tone(90, .18, 'sawtooth', .07, 60); tone(140, .12, 'square', .03, 80); },   // V8-Brummen
  score: () => { tone(880, .08, 'triangle', .07); setTimeout(() => tone(1320, .1, 'triangle', .07), 70); },
  crash: () => { tone(160, .5, 'sawtooth', .09, -130); tone(60, .4, 'square', .06, -20); }
};

/* ---------- Zustand ---------- */
const G = 1500, FLAP = -430, SPEED0 = 165;
let state = 'ready', car, pipes, score, best = 0, t = 0, speed, spawnX, groundX = 0, deadT = 0, particles = [], flash = 0, newBest = false;
try { best = +localStorage.getItem('drini_bird_best') || 0; } catch(e) {}
const stars = Array.from({length: 70}, () => ({ x: Math.random(), y: Math.random()*0.55, s: Math.random()*1.4+0.4, p: Math.random()*6 }));
const city = []; { let x = 0; while (x < 2400) { const w = 40 + Math.random()*70; city.push({ x, w, h: 60 + Math.random()*170, s: Math.floor(Math.random()*999) }); x += w + 4; } }

function reset(){
  car = { x: LW*0.28, y: LH*0.42, vy: 0, rot: 0 };
  pipes = []; score = 0; speed = SPEED0; spawnX = LW + 60; particles = []; newBest = false;
}
reset();

function flap(){
  audio();
  if (state === 'ready') { state = 'play'; }
  if (state === 'play') { car.vy = FLAP; sfx.flap(); for (let i = 0; i < 6; i++) particles.push({ x: car.x - 34, y: car.y + 6, vx: -80 - Math.random()*120, vy: (Math.random()-0.5)*60, life: 0.35 + Math.random()*0.2, c: Math.random() < .5 ? '#ffb347' : '#ff5e3a' }); }
  else if (state === 'dead' && deadT > 0.6) { reset(); state = 'ready'; }
}
cv.addEventListener('pointerdown', e => { e.preventDefault(); flap(); }, { passive: false });
addEventListener('touchmove', e => e.preventDefault(), { passive: false });
addEventListener('keydown', e => { if (['Space','ArrowUp','KeyW','Enter'].includes(e.code)) { e.preventDefault(); if (!e.repeat) flap(); } });

const GROUND = LH - 90;
function gap(){ return Math.max(150, 190 - score*1.5); }

function addPipe(){
  const g = gap(), minY = 90, maxY = GROUND - g - 70;
  pipes.push({ x: spawnX, top: minY + Math.random()*(maxY - minY), g, w: 70, passed: false });
}

function update(dt){
  t += dt; if (flash > 0) flash -= dt;
  for (const p of particles) { p.x += p.vx*dt; p.y += p.vy*dt; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  if (state === 'ready') { car.y = LH*0.42 + Math.sin(t*3)*10; car.rot = Math.sin(t*3)*0.05; groundX -= speed*dt; return; }
  if (state === 'dead') { deadT += dt; if (car.y < GROUND - 14) { car.vy += G*dt; car.y += car.vy*dt; car.rot = Math.min(1.4, car.rot + dt*5); } return; }

  speed = SPEED0 + Math.min(110, score*3);
  car.vy += G*dt; car.y += car.vy*dt;
  car.rot = Math.max(-0.45, Math.min(1.2, car.vy / 650));
  groundX -= speed*dt;
  if (!pipes.length || pipes[pipes.length-1].x < LW - 230) { spawnX = LW + 40; addPipe(); }
  for (const p of pipes) {
    p.x -= speed*dt;
    if (!p.passed && p.x + p.w < car.x - 30) { p.passed = true; score++; sfx.score(); }
  }
  pipes = pipes.filter(p => p.x + p.w > -20);
  // Kollision (Hitbox etwas kleiner als das Auto)
  const hx = car.x - 28, hy = car.y - 10, hw = 56, hh = 20;
  if (car.y < 20) { car.y = 20; if (car.vy < 0) car.vy = 0; }
  let hit = car.y + 12 > GROUND;
  for (const p of pipes) {
    if (hx < p.x + p.w && hx + hw > p.x && (hy < p.top || hy + hh > p.top + p.g)) hit = true;
  }
  if (hit) die();
}
function die(){
  state = 'dead'; deadT = 0; flash = 0.25; sfx.crash();
  if (navigator.vibrate) try { navigator.vibrate(120); } catch(e) {}
  for (let i = 0; i < 24; i++) particles.push({ x: car.x, y: car.y, vx: (Math.random()-0.5)*320, vy: (Math.random()-0.8)*300, life: 0.5 + Math.random()*0.5, c: ['#ffb347','#ff5e3a','#cfd8e6','#222'][i%4] });
  if (score > best) { best = score; newBest = true; try { localStorage.setItem('drini_bird_best', best); } catch(e) {} }
}

/* ---------- Zeichnen ---------- */
function rr(x, y, w, h, r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function circ(x, y, r, c){ ctx.fillStyle = c; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI*2); ctx.fill(); }

function drawBg(){
  const g = ctx.createLinearGradient(0, 0, 0, LH);
  g.addColorStop(0, '#0b1026'); g.addColorStop(0.55, '#2a2f6b'); g.addColorStop(1, '#e0705a');
  ctx.fillStyle = g; ctx.fillRect(0, 0, LW, LH);
  for (const s of stars) { ctx.globalAlpha = 0.4 + 0.6*Math.abs(Math.sin(t + s.p)); circ(s.x*LW, s.y*LH, s.s, '#fff'); }
  ctx.globalAlpha = 1;
  ctx.globalAlpha = 0.18; circ(LW*0.8, 110, 52, '#f6f0d2'); ctx.globalAlpha = 1; circ(LW*0.8, 110, 30, '#f6f0d2'); circ(LW*0.8 - 8, 104, 6, '#e3dcb8'); circ(LW*0.8 + 9, 118, 4, '#e3dcb8');
  // Skyline (Parallax)
  const off = (groundX*0.25) % 2400;
  for (const b of city) for (const k of [0, 2400]) {
    const x = b.x + off + k; if (x > LW || x + b.w < 0) continue;
    const y = GROUND - b.h;
    ctx.fillStyle = '#161b3f'; ctx.fillRect(x, y, b.w, b.h);
    for (let wy = y + 10, j = 0; wy < GROUND - 12; wy += 16, j++) for (let wx = x + 7, i = 0; wx < x + b.w - 9; wx += 13, i++) {
      if ((i*7 + j*11 + b.s) % 4 === 0) { ctx.fillStyle = '#ffd36a'; ctx.fillRect(wx, wy, 5, 7); }
    }
  }
}

function drawPipe(p){
  const stripe = (x, y, w, h) => {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.fillStyle = '#f4f4f4'; ctx.fillRect(x, y, w, h);
    ctx.fillStyle = '#ff6a1a';
    for (let s = -h; s < w + h; s += 28) { ctx.beginPath(); ctx.moveTo(x + s, y); ctx.lineTo(x + s + 14, y); ctx.lineTo(x + s + 14 - h, y + h); ctx.lineTo(x + s - h, y + h); ctx.fill(); }
    ctx.restore();
  };
  // Betonpfeiler
  const body = (x, y, w, h) => { ctx.fillStyle = '#8b93a7'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#6f778b'; ctx.fillRect(x + w - 12, y, 12, h); ctx.fillStyle = '#a3abbe'; ctx.fillRect(x + 6, y, 6, h); };
  body(p.x + 6, -10, p.w - 12, p.top - 14 + 10);
  stripe(p.x, p.top - 24, p.w, 24);
  ctx.strokeStyle = '#222'; ctx.lineWidth = 2; ctx.strokeRect(p.x, p.top - 24, p.w, 24);
  const by = p.top + p.g;
  stripe(p.x, by, p.w, 24); ctx.strokeRect(p.x, by, p.w, 24);
  body(p.x + 6, by + 24, p.w - 12, GROUND - by - 24);
  // Warnlichter
  const on = Math.floor(t*4) % 2 === 0;
  circ(p.x + 12, p.top - 28, 4, on ? '#ffcc00' : '#7a5d00'); circ(p.x + p.w - 12, by - 4, 4, on ? '#7a5d00' : '#ffcc00');
}

function drawGround(){
  ctx.fillStyle = '#2b2d36'; ctx.fillRect(0, GROUND, LW, LH - GROUND);
  ctx.fillStyle = '#c9ccd6'; ctx.fillRect(0, GROUND, LW, 6);
  ctx.fillStyle = '#f2c94c';
  const o = ((groundX % 60) + 60) % 60;
  for (let x = o - 60; x < LW; x += 60) ctx.fillRect(x, GROUND + 40, 32, 5);
  ctx.fillStyle = '#1d1f26'; ctx.fillRect(0, LH - 24, LW, 24);
}

function drawCar(){
  ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.rot);
  // Schatten-Glow
  ctx.globalAlpha = 0.25; ctx.fillStyle = '#4da3ff'; ctx.beginPath(); ctx.ellipse(0, 14, 36, 5, 0, 0, Math.PI*2); ctx.fill(); ctx.globalAlpha = 1;
  // Karosserie (langes, flaches Coupé, Front rechts)
  ctx.fillStyle = '#0d0d10';
  ctx.beginPath();
  ctx.moveTo(-36, 6);           // Heck unten
  ctx.lineTo(-37, -2);
  ctx.quadraticCurveTo(-35, -8, -26, -9);   // Heckdeckel
  ctx.quadraticCurveTo(-14, -21, 2, -21);   // Fastback-Dach
  ctx.quadraticCurveTo(12, -20, 18, -10);   // Windschutzscheibe
  ctx.lineTo(33, -6);           // lange Motorhaube
  ctx.quadraticCurveTo(38, -4, 38, 2);      // Front
  ctx.lineTo(37, 7);
  ctx.closePath(); ctx.fill(); ctx.strokeStyle = 'rgba(200,215,240,.55)'; ctx.lineWidth = 1.2; ctx.stroke();
  // Glanzlinie
  ctx.strokeStyle = '#5a5f6b'; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(-30, -6); ctx.quadraticCurveTo(0, -9, 34, -4); ctx.stroke();
  // Fenster
  ctx.fillStyle = '#6f8aa8';
  ctx.beginPath(); ctx.moveTo(-20, -9); ctx.quadraticCurveTo(-11, -18, 1, -18); ctx.quadraticCurveTo(9, -17, 14, -10); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#0d0d10'; ctx.fillRect(-4, -18, 2.5, 9);
  // Schwelle & Unterteil
  ctx.fillStyle = '#050506'; ctx.fillRect(-34, 4, 70, 4);
  // Scheinwerfer & Rücklicht
  ctx.fillStyle = '#eaf6ff'; ctx.beginPath(); ctx.moveTo(30, -4); ctx.lineTo(37, -2); ctx.lineTo(36, 1); ctx.lineTo(29, -1); ctx.fill();
  ctx.fillStyle = '#ff2b3a'; ctx.fillRect(-37, -4, 4, 4);
  // Kühlergrill (dunkel)
  ctx.fillStyle = '#0a0f1c'; rr(33, 1, 5, 5, 1.5); ctx.fill();
  // Kennzeichen
  ctx.fillStyle = '#fff'; ctx.fillRect(-36, 0, 1.6, 5);
  // Räder
  for (const wx of [-22, 22]) {
    circ(wx, 8, 8, '#111'); circ(wx, 8, 5.4, '#9aa3b5'); circ(wx, 8, 2, '#3a4152');
    ctx.strokeStyle = '#3a4152'; ctx.lineWidth = 1.2; const a = t*18;
    for (let k = 0; k < 5; k++) { const an = a + k*Math.PI*2/5; ctx.beginPath(); ctx.moveTo(wx, 8); ctx.lineTo(wx + Math.cos(an)*5, 8 + Math.sin(an)*5); ctx.stroke(); }
    circ(wx + 3, 8, 1.6, '#3a6cff'); // blaue Bremssättel
  }
  // Fahrer-Silhouette
  circ(-2, -13, 3.2, '#1c2330');
  ctx.restore();
  // Auspuffflamme beim Steigen
  if (state === 'play' && car.vy < -150) {
    ctx.save(); ctx.translate(car.x, car.y); ctx.rotate(car.rot);
    const fl = 8 + Math.random()*8;
    ctx.fillStyle = '#ffb347'; ctx.beginPath(); ctx.moveTo(-37, 3); ctx.lineTo(-37 - fl, 5); ctx.lineTo(-37, 7); ctx.fill();
    ctx.restore();
  }
}

function text(s, x, y, size, col='#fff', align='center', weight='900'){
  ctx.font = `${weight} ${size}px -apple-system, system-ui, Segoe UI, sans-serif`; ctx.textAlign = align;
  ctx.lineWidth = Math.max(3, size/7); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y);
  ctx.fillStyle = col; ctx.fillText(s, x, y);
}

function draw(){
  ctx.setTransform(dpr*scale, 0, 0, dpr*scale, (cv.width - LW*scale*dpr)/2, 0);
  drawBg();
  for (const p of pipes) drawPipe(p);
  drawGround();
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life*2); ctx.fillStyle = p.c; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  drawCar();
  const top = 70;
  if (state === 'ready') {
    text('DRINI BIRD', LW/2, 150, 52, '#ffd36a');
    text('M850i Edition', LW/2, 186, 20, '#9fd3ff', 'center', '700');
    if (Math.floor(t*2) % 2 === 0) text('Tippen zum Starten', LW/2, LH*0.62, 24, '#fff', 'center', '800');
    text('Bestleistung: ' + best, LW/2, LH*0.62 + 40, 18, '#cfd8e6', 'center', '700');
  } else {
    text(String(score), LW/2, top + 20, 56);
  }
  if (state === 'dead') {
    const pw = Math.min(300, LW - 40), ph = 230, px = LW/2 - pw/2, py = LH*0.28;
    ctx.fillStyle = 'rgba(11,16,38,.88)'; rr(px, py, pw, ph, 18); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = 2; ctx.stroke();
    text('Crash!', LW/2, py + 52, 40, '#ff6b6b');
    text('Punkte: ' + score, LW/2, py + 100, 24, '#fff', 'center', '800');
    text('Rekord: ' + best, LW/2, py + 134, 22, '#ffd36a', 'center', '800');
    if (newBest) text('NEUER REKORD!', LW/2, py + 166, 18, '#7dffb0', 'center', '900');
    if (deadT > 0.6 && Math.floor(t*2) % 2 === 0) text('Tippen für neue Runde', LW/2, py + 205, 18, '#cfd8e6', 'center', '700');
  }
  if (flash > 0) { ctx.fillStyle = `rgba(255,255,255,${flash*2})`; ctx.fillRect(0, 0, LW, LH); }
  // Ränder bei Querformat abdunkeln
  ctx.setTransform(1, 0, 0, 1, 0, 0);
}

let last = performance.now();
function loop(now){
  const dt = Math.min(0.033, (now - last)/1000); last = now;
  update(dt); ctx.fillStyle = '#0b1026'; ctx.fillRect(0, 0, cv.width, cv.height); draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
window.__db = { get state(){ return state; }, get score(){ return score; }, get car(){ return car; }, get pipes(){ return pipes; }, flap };
})();
</script>
</body>
</html>
